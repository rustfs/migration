[package]
name = "rf"
version = "0.1.0"
edition = "2021"
description = "Safe one-way bucket migration tool between two S3-compatible (RustFS) clusters"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
aws-sdk-s3 = "1"
aws-smithy-types = { version = "1", features = ["rt-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
indicatif = "0.17"
chrono = { version = "0.4" }
tempfile = "3"
httpdate = "1"
futures = "0.3"

[profile.release]
strip = true
lto = true
