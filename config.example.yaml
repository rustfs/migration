# Sample config for `migration`.
# 配置模板。环境变量若设置会覆盖 YAML。
#
# Env / 环境变量:
#   OLD_ENDPOINT OLD_AK OLD_SK OLD_REGION
#   NEW_ENDPOINT NEW_AK NEW_SK NEW_REGION REGION
#   BUCKET DB_PATH CONFLICT_LOG SPOOL_DIR

old:
  endpoint: "http://10.0.0.1:9000"     # source / 来源
  access_key: "OLD_AK"
  secret_key: "OLD_SK"
  region: "us-east-1"

new:
  endpoint: "http://haproxy.new.local:9000"  # target / 目标
  access_key: "NEW_AK"
  secret_key: "NEW_SK"
  region: "us-east-1"

# Empty = migrate every bucket on the source.
# 留空 = 迁移来源上的每一个桶。也可只填一个桶名。
bucket: ""

db_path: "./migration.db"
conflict_log: "./conflict.log"
# Temp dir for small-object spooling. Default = directory of db_path.
# 小对象落盘目录。默认是 db_path 所在目录。若 /tmp 是内存盘请改到真实磁盘。
spool_dir: ""

# No bandwidth / rate_limit / MB/s field. Peak ≈ workers × multipart_concurrency.
# 没有 bandwidth、rate_limit 或 MB/s 字段。峰值大约是 workers × multipart_concurrency。
# Lower workers first (then multipart_concurrency). Watch `migration status` and the NIC.
# Stay under HAProxy maxconn. 先调小并发，再看 status 和网卡，留出 HAProxy maxconn 余量。
workers: 16                     # objects copied at once / 同时拷贝的对象数（默认 16）
multipart_threshold: 52428800   # 50 MiB；size ≥ this uses multipart / 达到则分片
multipart_part_size: 16777216   # 16 MiB. Must be >= 5 MiB (5242880); smaller values fail at load and are not raised. / 非末片至少 5 MiB，更小则加载失败，不会被改写
multipart_concurrency: 4        # parallel parts per large object / 单个大对象的并行分片数（默认 4）
