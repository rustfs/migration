# migration 配置模板。
# 优先级：命令行 > 环境变量 > 本文件 > 内置默认值。
# Sample config. CLI flags override env, env overrides this file.
# The target must honor If-None-Match: * on PutObject and CompleteMultipartUpload.
# 目标端必须支持普通上传和完成分片上传时的条件写入，才能保留并发写入的同名对象。
#
# Env / 环境变量:
#   OLD_ENDPOINT OLD_AK OLD_SK OLD_REGION OLD_SESSION_TOKEN
#   NEW_ENDPOINT NEW_AK NEW_SK NEW_REGION NEW_SESSION_TOKEN REGION
#   BUCKET DB_PATH CONFLICT_LOG SPOOL_DIR
#   WORKERS MULTIPART_CONCURRENCY RATE_LIMIT SOURCE_FROZEN

old:
  endpoint: "http://10.0.0.1:9000"     # source / 来源（只读）
  access_key: "OLD_AK"
  secret_key: "OLD_SK"
  region: "us-east-1"

new:
  endpoint: "http://haproxy.new.local:9000"  # target / 目标（读 + 写，需能 CreateBucket）
  access_key: "NEW_AK"
  secret_key: "NEW_SK"
  region: "us-east-1"

# Empty = migrate every bucket on the source.
# 留空 = 迁移来源上的每一个桶。也可只填一个桶名。
bucket: ""

db_path: "./migration.db"
conflict_log: "./conflict.log"
# Temp dir for object and multipart-part spooling. Default = directory of db_path.
# 对象和分片落盘目录。默认是 db_path 所在目录。若 /tmp 是内存盘请改到真实磁盘。
# workers 越大，同时存在的临时文件越多，请留出磁盘空间。
# Maximum aggregate bytes reserved for temporary copy files (default: 1 GiB).
spool_max_bytes: 1073741824
spool_dir: ""

# 对象并发：run / migrate 同时复制多少个对象，diff 同时读取并校验多少个对象。
# scan 始终单线程（List 分页必须串行），不受此项影响。
# 省略或写 0 = 默认 16。负数会报错。须 >= 1。
# 命令行覆盖：--workers 32 。环境变量：WORKERS（覆盖本文件，但命令行优先）。
# 小文件很多、源和代理都吃得消时再加大；出现 503、超时就减小。
# 排错可以临时 --workers 1，等价于串行复制。
# 在途请求峰值大约是 workers × multipart_concurrency。字节速率另见下面的 rate_limit。
# 代理返回 503 时先调小并发，再看 status 和网卡，留出 HAProxy maxconn 余量。
workers: 16

# 对象大小 >= 该字节数时走分片上传。省略或 0 = 50MiB。
multipart_threshold: 52428800   # 50 MiB

# 每个分片的大小。省略或 0 = 16MiB。
# 每片可配置为 5 MiB 至 5 GiB。实际最后一片可以更小。超出范围会在加载配置时失败。
# 分片数要超过 S3 上限 10000 时，工具会自动加大分片，无需手算。
multipart_part_size: 16777216   # 16 MiB

# 单个大对象内部，同时上传多少个分片。与 workers 是两个旋钮。
# 省略或写 0 = 默认 4。负数会报错。须 >= 1。
# 命令行：--multipart-concurrency 8 。环境变量：MULTIPART_CONCURRENCY。
# 只影响大对象。小文件吞吐看 workers，不看这项。
# 峰值约 workers × multipart_concurrency 个打到同一集群的在途请求。
# 例：16 × 4 = 64。代理 maxconn、源盘和目标盘都要撑得住这个乘积。
multipart_concurrency: 4

# 带宽上限：所有 worker（含同一个大对象里的分片）从源读取的合计字节/秒。
# 省略或写 0 = 不限速。命令行、环境变量里的 0 同样是不限速（和 workers 不同：
# workers 的 0 在 YAML 里表示默认 16，在命令行里会报错）。
# 优先级：--rate-limit > 环境变量 RATE_LIMIT > 本文件 > 默认不限速。
#
# 单位一定要看清。M 是十进制 MB，Mi 才是 1024 进制的 MiB：
#   20M / 20MB   = 20 × 1000 × 1000 = 20000000 字节/秒
#   30M          = 30000000 字节/秒
#   50M / 50MB   = 50000000 字节/秒
#   20Mi / 20MiB = 20 × 1024 × 1024 = 20971520 字节/秒
# 裸数字表示字节/秒，例如 1048576。大小写不敏感，可以加 /s。
# K/KB=1000，Ki/KiB=1024；G/GB=1000³，Gi/GiB=1024³。
# 只限制 run / migrate 复制对象正文。scan / list 不读正文；diff 完整读取两端正文，但不受此速率参数限制。
# 生产时段示例：rate_limit: 20M 。确认不影响业务后再调到 30M 或 50M。
rate_limit: 0

# 在应用/存储层冻结源写入及删除后才设 true；本参数不自动冻结 S3。
# 迁移和最终验收期间必须保持冻结；涉及清单对象的业务删除（包括目标端）也必须暂停或有墓碑协调。
# 也可使用 --source-frozen。
source_frozen: false
